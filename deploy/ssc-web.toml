# Read-only web UI/API for the SSC recorder database.
#
# The web process never writes to the database. The database path must match
# the recorder configuration.

[web]
database = "/var/lib/ssc-recorder/ssc.sqlite3"
host = "127.0.0.1"
port = 8009
root_path = ""

# Raw EEPROM contains password fields. Keep this disabled unless the endpoint
# is protected by authentication and/or a trusted reverse proxy.
raw_eeprom_download = false

default_range_days = 30
max_presence_intervals = 5000
max_history_points = 5000
max_export_rows = 200000

# Optional HTTP Basic authentication. Leave basic_auth_user empty to disable.
# The password is read from the named environment variable, never from TOML.
basic_auth_user = ""
basic_auth_password_env = "SSC_WEB_PASSWORD"