[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schell-ssc-ble-client"
version = "0.1.0"
description = "BLE client for Schell SSC (SE2) sanitary fittings"
requires-python = ">=3.12"
dependencies = [
    "simplepyble>=1.4.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.scripts]
ssc = "ssc.cli.main:main"
ssc-recorder = "ssc.recorder.runner:main"
ssc-web = "ssc.web.__main__:main"

[tool.setuptools.packages.find]
include = ["ssc*"]

[tool.setuptools.package-data]
"ssc.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses call expressions in argument defaults.
"ssc/web/routers/*.py" = ["B008"]