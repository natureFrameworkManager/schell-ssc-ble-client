[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schell-ssc-ble-client"
version = "0.1.0"
description = "BLE client for Schell SSC (SE2) sanitary fittings"
requires-python = ">=3.12"
dependencies = ["simplepyble>=1.4.0"]

[project.scripts]
ssc = "ssc.cli.main:main"

[tool.setuptools.packages.find]
include = ["ssc*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]